# Gera a animação da cobrinha a partir do gráfico de contribuições
# e publica os SVGs na branch "output" (usada pelo README).
name: Cobrinha de contribuições

on:
  schedule:
    - cron: "0 6 * * *" # todo dia, 03:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#18181B&color_dots=#ebedf0,#d4d4d8,#a1a1aa,#52525b,#18181b
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFFFFF&color_dots=#161616,#3f3f46,#71717a,#a1a1aa,#e4e4e7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
